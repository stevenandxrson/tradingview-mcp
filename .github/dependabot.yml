# Security updates only: Dependabot opens one grouped PR against the default
# branch (jarvis-runtime) when an advisory hits the lockfile. Routine version
# bumps stay off (open-pull-requests-limit: 0) to keep the runtime stable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
